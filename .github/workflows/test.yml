name: Test
on:
  push:
    branches: [ main ]
  # Issue #53: no `branches:` filter here on purpose. A `pull_request`
  # branch filter matches the *base*, so restricting it to `main` left
  # every stacked PR (one opened against another feature branch) with no
  # check run at all -- PR #60 reached review with zero workflow runs.
  # Dropping the filter is the conservative choice: it can only add
  # coverage, and it does not depend on this project's branch naming.
  pull_request:
jobs:
  nf-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run variant QC summarizer unit tests
        run: python3 -m unittest discover -s tests/bin -v

      - name: Install Nextflow
        uses: nf-core/setup-nextflow@v2
        with:
          version: "26.04.6"
          java-version: "21"

      - name: Install nf-test
        uses: nf-core/setup-nf-test@v1
        with:
          version: "0.9.5"

      - name: Lint
        run: nextflow lint .

      - name: Run nf-test suite (pipeline-level and module-level)
        run: >-
          nf-test test
          tests/pipeline/adzuki_snp_pipeline.nf.test
          tests/modules/gatk_selectvariants.nf.test
          tests/modules/gatk_variantfiltration.nf.test
          tests/modules/gs_normalize_variants.nf.test
          tests/modules/bwa_mem2_mem_sort.nf.test
          tests/modules/validate_reference_contigs.nf.test
          tests/modules/gatk_genomicsdbimport.nf.test
          tests/modules/gatk_gathervcfs.nf.test
          tests/modules/fastqc.nf.test
          tests/modules/multiqc.nf.test
          tests/modules/hash_input_fastqs.nf.test
          tests/modules/build_run_manifest.nf.test
          tests/modules/build_gs_panel.nf.test
          tests/modules/docker_host_user_ownership.nf.test
          tests/functions/resolve_pipeline_commit.nf.test
          --ci
